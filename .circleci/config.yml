version: 2.1

jobs:
  build:
    docker:
      - image: cimg/openjdk:21.0
    steps:
      - checkout

      - restore_cache:
          keys:
            - maven-deps-{{ checksum "pom.xml" }}
            - maven-deps-

      - run:
          name: Build the application
          command: mvn -B clean install -DskipTests

      - save_cache:
          paths:
            - ~/.m2
          key: maven-deps-{{ checksum "pom.xml" }}

      - persist_to_workspace:
          root: .
          paths:
            - target/*.jar

  test:
    docker:
      - image: cimg/openjdk:21.0

      - image: cimg/postgres:16.0
        environment:
          POSTGRES_DB: simplecrmlite
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password

    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/simplecrmlite
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: password
      SPRING_JPA_HIBERNATE_DDL_AUTO: create

    steps:
      - checkout

      - restore_cache:
          keys:
            - maven-deps-{{ checksum "pom.xml" }}
            - maven-deps-

      - run:
          name: Install PostgreSQL client
          command: |
            sudo apt-get update
            sudo apt-get install -y postgresql-client

      - run:
          name: Wait for PostgreSQL
          command: |
            for i in {1..10}; do
              if pg_isready -h localhost -p 5432 -U postgres -d simplecrmlite; then
                echo "PostgreSQL is ready!"
                exit 0
              fi
              echo "Waiting for PostgreSQL... ($i/10)"
              sleep 3
            done
            echo "PostgreSQL failed to start"
            exit 1

      - run:
          name: Run all tests
          command: mvn -B test

      - store_test_results:
          path: target/surefire-reports

      - store_artifacts:
          path: target/surefire-reports

  publish:
    docker:
      - image: cimg/base:stable
    steps:
      - checkout

      - attach_workspace:
          at: .

      - setup_remote_docker

      - run:
          name: Build the Docker image
          command: |
            docker build --platform linux/amd64 \
              -t "${DOCKER_USERNAME}/4.11-simple-crm-lite:latest" .

      - run:
          name: Push to Docker Hub
          command: |
            printf '%s' "$DOCKER_TOKEN" | docker login \
              --username "$DOCKER_USERNAME" --password-stdin
            docker push "${DOCKER_USERNAME}/4.11-simple-crm-lite:latest"

workflows:
  build_test_publish:
    jobs:
      - build

      - test:
          requires:
            - build

      - publish:
          context: docker-hub
          requires:
            - test
          filters:
            branches:
              only: main